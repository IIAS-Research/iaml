[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies.cudf = { file = ["requirements.cudf.txt"] }

[project]
name = "automed"
version = "0.0.1"
authors = [
  { name="Rudy MERIEUX", email="rmerieux@chu-reims.fr" },
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dynamic = ["dependencies", "optional-dependencies"]

[project.urls]
"Homepage" = "http://docs.example.invalid/automl/main/"
"Bug Tracker" = "https://gitlab.example.invalid/"
