[project]
name = "PyIAML"
version = "1.0.1"
authors = [
    { name="Rudy MERIEUX", email="rmerieux@chu-reims.fr" },
    { name="Hugo RUELLET", email="hruellet@chu-reims.fr" },
    { name="Robin BOURACHOT", email="rbourachot@chu-reims.fr" },
    { name="Youssouf DAHLOUK", email="ydahlouk@chu-reims.fr" },
]
description = "Integrated AutoML for Medical Labs: explainable pipelines for clinical research"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
license = { file = "LICENSE" }
dependencies = [
    "catboost>=1.2.7",
    "gensim>=4.3.3",
    "imbalanced-learn>=0.12.3",
    "matplotlib>=3.9.2",
    "multipledispatch>=1.0.0",
    "multiprocess>=0.70.16",
    "nltk>=3.9.1",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "rich>=13.8.1",
    "scikit-learn>=1.5.2",
    "shap==0.47.1",
    "scikit-survival>=0.23.0",
    "psutil>=6.0.0",
    "yellowbrick>=1.5",
    "setuptools>=68; python_version >= '3.12'",
    "scikit-optimize>=0.10.2",
    "miceforest>=6.0.3",
    "xgboost>=3.0.5",
]

[dependency-groups]
gpu = [
    "cudf-cu11>=24.8.1; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]

[project.urls]
"Homepage" = "https://github.com/IIAS-Research/iaml"
"Issues" = "https://github.com/IIAS-Research/iaml/issues"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "iaml" = "src/iaml" }

[tool.uv]
dev-dependencies = [
    "ipykernel>=6.29.5",
    "sphinx>=8.1.3",
    "pylint>=3.2.7",
    "ipywidgets>=8.1.5",
    "pre-commit>=3.8.0",
    "sphinx-autoapi>=3.3.3",
    "furo>=2025.12.19",
]

[tool.uv.dependency-groups]
gpu = { requires-python = ">=3.10,<3.14" }

# Use RAPIDS wheels directly, including cuDF's transitive dependencies.
[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
