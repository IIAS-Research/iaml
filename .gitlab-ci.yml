###########
# Testing #
###########
stages:
  - build
  - linting
  - perfs # CI
  - docs
  - deploy

job:build:pythonEnv:
  stage: build
  tags:
    - unix
    - test
    - calcul
  script:
    - '/usr/bin/python3 -m venv /home/gitlab-runner/.automl_venv'
    - 'source /home/gitlab-runner/.automl_venv/bin/activate'
    - 'pip install -r requirements.txt'
  # artifacts:
  #   expose_as: 'Python virtual env'
  #   expire_in: 2h
  #   paths: 
  #     - .venv

job:linting:PyLint:
  stage: linting
  tags:
    - unix
    - test
    - calcul
  allow_failure: true
  script:
    - 'source /home/gitlab-runner/.automl_venv/bin/activate'
    - 'pylint --rcfile=.pylintrc ./src/automed'

job:test:unit:
  stage: perfs
  tags:
    - unix
    - test
    - calcul
  except:
    - main
  script:
    - 'source /home/gitlab-runner/.automl_venv/bin/activate'
    - 'pip install -r requirements.txt'
    - 'python3 ./tests/tests.py unit'

