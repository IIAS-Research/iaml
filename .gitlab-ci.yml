###########
# Testing #
###########
stages:
  - build
  - linting
  - test
  - docs
  - deploy

variables:
  UV_PROJECT_ENVIRONMENT: "$CI_PROJECT_DIR/.venv"
  UV_NO_GROUP: "gpu"
  MPLBACKEND: Agg

.python-job:
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends libgomp1

job:build:pythonEnv:
  extends: .python-job
  stage: build
  tags:
    - unix
    - test
    - calcul
  script:
    - 'uv sync --locked'

job:linting:PyLint:
  extends: .python-job
  stage: linting
  tags:
    - unix
    - test
    - calcul
  allow_failure: true
  script:
    - 'uv run --locked pylint --rcfile=.pylintrc src/iaml'

job:test:unit:
  extends: .python-job
  stage: test
  tags:
    - unix
    - test
    - calcul
  script:
    - 'uv run --locked python -m tests unit'

job:test:components:
  extends: .python-job
  stage: test
  tags:
    - unix
    - test
    - calcul
  parallel:
    matrix:
      - TEST_SUITE: [steps, statistics]
  script:
    - 'uv run --locked python -m tests "$TEST_SUITE"'

job:test:full:
  extends: .python-job
  stage: test
  only:
    - main
  tags:
    - unix
    - test
    - calcul
  script:
    - 'uv run --locked python -m tests integration'

###################
## DOCUMENTATION ##
###################

job:docs:create:
  extends: .python-job
  stage: docs
  tags:
    - unix
  script:
    - 'uv run --locked sphinx-build -W --keep-going -b html docs public'
  artifacts:
    expose_as: 'HTML Static documentation'
    paths:
      - public

job:deploy:docs:
  stage: deploy
  tags:
    - unix
    - test
    - documentation
  only:
    - main
  script: 
    - 'if [ -d "/var/www/docs/$CI_PROJECT_NAME/$CI_COMMIT_BRANCH" ]; then rm -r /var/www/docs/$CI_PROJECT_NAME/$CI_COMMIT_BRANCH; fi'
    - 'mkdir -p /var/www/docs/$CI_PROJECT_NAME'
    - 'mv ./public /var/www/docs/$CI_PROJECT_NAME/$CI_COMMIT_BRANCH'
