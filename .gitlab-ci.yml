stages:
  - build
  - perfs # CI
  - docs
  - deploy

job:build:pythonEnv:
  stage: build
  tags:
    - unix
    - test
  script:
    - '/usr/bin/python3 -m venv /home/gitlab-runner/.automl_venv'
    - 'source /home/gitlab-runner/.automl_venv/bin/activate'
    - 'pip install -r requirements.txt'
