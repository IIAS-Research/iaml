###################
## PERFORMANCES  ##
###################

job:perfs:compute:
  stage: perfs
  timeout: 8h
  tags:
    - unix
    - calcul
  script:
    - 'source /home/gitlab-runner/.automl_venv/bin/activate'
    - 'if [ -e "./python_project/src/perf_logger/tests_data/history.log" ]; then rm ./python_project/src/perf_logger/tests_data/history.log ;fi'
    - 'if [ -e "/home/gitlab-runner/automl_history.log" ]; then cp /home/gitlab-runner/automl_history.log ./python_project/src/perf_logger/tests_data/history.log ;fi'
    - 'python3 python_project/src/perf_logger/perf_logger.py $CI_COMMIT_SHORT_SHA' # Compute perfs
    - 'python3 python_project/src/perf_logger/perf_comparator.py' # Compute perfs
    - 'if [ -e "/home/gitlab-runner/automl_history.log.old" ]; then rm /home/gitlab-runner/automl_history.log.old ;fi'
    - 'if [ -e "/home/gitlab-runner/automl_history.log" ]; then mv /home/gitlab-runner/automl_history.log /home/gitlab-runner/automl_history.log.old ;fi'
    - 'cp ./python_project/src/perf_logger/tests_data/history.log /home/gitlab-runner/automl_history.log'
  artifacts:
    expose_as: 'Compute performances of AutoMed'
    paths:
      - docs
      - ./python_project/src/perf_logger/tests_data/history.log

###################
## DOCUMENTATION ##
###################

job:docs:create:
  stage: docs
  tags:
    - unix
  script:
    - 'source /home/gitlab-runner/.automl_venv/bin/activate'
    - 'python3 -m pip install mkdocs'
    - 'python3 -m mkdocs build -d public'
  artifacts:
    expose_as: 'HTML Static documentation'
    paths:
      - public

job:deploy:docs:
  stage: deploy
  tags:
    - unix
    - test
    - documentation
  script: 
    - 'if [ -d "/var/www/docs/$CI_PROJECT_NAME/$CI_COMMIT_BRANCH" ]; then rm -r /var/www/docs/$CI_PROJECT_NAME/$CI_COMMIT_BRANCH; fi'
    - 'mkdir -p /var/www/docs/$CI_PROJECT_NAME'
    - 'mv ./public /var/www/docs/$CI_PROJECT_NAME/$CI_COMMIT_BRANCH'